<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Game Platform</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; display: inline-block; margin: 20px; border: 2px dashed #444; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; }
        .card { background: #222; padding: 15px; border-radius: 10px; border: 1px solid #333; position: relative; }
        iframe { width: 100%; height: 250px; border: none; background: #000; border-radius: 5px; }
        button { background: #00ca4e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        input { display: block; margin: 10px auto; padding: 8px; width: 250px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; }
        
        /* Subtiele extra stijlen voor de nieuwe functies die binnen je UI passen */
        .search-bar { width: 300px; margin: 30px auto 10px auto; font-size: 16px; border: 1px solid #00ca4e; }
        .fs-link { display: inline-block; margin-top: 8px; color: #007bff; text-decoration: none; font-size: 13px; font-weight: bold; cursor: pointer; margin-right: 15px; }
        .fs-link:hover { text-decoration: underline; }
        .like-btn { display: inline-block; margin-top: 8px; background: none; border: none; color: #ff4757; font-size: 14px; cursor: pointer; padding: 0; font-weight: bold; }
        .like-btn:hover { transform: scale(1.1); }
    </style>
    <!-- De stabiele server-link voor de database software -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <h1>🎮 Open Game Platform</h1>
    <p>Speel gratis HTML-games, gemaakt door de community!</p>

    <!-- HIER KUNNEN MENSEN UPLOADEN -->
    <div class="box">
        <h3>Zelf een game uploaden?</h3>
        <input type="text" id="gameNaam" placeholder="Naam van je game...">
        <input type="file" id="gameBestand" accept=".html">
        
        <div style="margin: 10px 0; font-size: 14px; text-align: left; display: inline-block;">
            <label style="display: block;"><input type="checkbox" id="checkPC"> 🖥 Geschikt voor PC</label>
            <label style="display: block;"><input type="checkbox" id="checkMobiel"> 📱 Geschikt voor telefoon</label>
        </div>
        
        <button onclick="uploadDeGame()">Nu Uploaden & Publiceren</button>
    </div>

    <hr style="border: 1px solid #333; margin-top: 30px;">

    <!-- NIEUW: De subtiele zoekbalk boven de gamelijst -->
    <input type="text" id="zoekBalk" class="search-bar" placeholder="🔍 Zoek een game..." oninput="filterGames()">

    <h2>Alle Games</h2>
    <div class="grid" id="gameLijst"></div>

    <script>
        // Jouw persoonlijke Supabase API-sleutels
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_Hrkm_ghr_xNpXdCYITo1Ug_F4assrx8";
        
        const supabase = supabasejs.createClient(SUPABASE_URL, SUPABASE_KEY);
        let alleGeladenGames = []; // Onthoudt de games voor de zoekbalk

        // 1. Functie om alle games op te halen en te tonen
        async function laadGames() {
            const { data, error } = await supabase.storage.from('games').list();
            if (error) {
                console.error("Fout bij laden van games:", error.message);
                return;
            }
            
            alleGeladenGames = data.filter(file => file.name !== ".emptyFolderPlaceholder");
            toonGames(alleGeladenGames);
        }

        // Bouwt de kaartjes op het scherm zonder je UI aan te tasten
        function toonGames(gamesLijst) {
            const lijst = document.getElementById('gameLijst');
            lijst.innerHTML = ""; 

            gamesLijst.forEach((file, index) => {
                const { data: urlData } = supabase.storage.from('games').getPublicUrl(file.name);
                
                let schoneNaam = file.name.replace('.html', '');
                let isPC = schoneNaam.includes('_PC');
                let isMobiel = schoneNaam.includes('_MOB');
                
                schoneNaam = schoneNaam.replace('_PC', '').replace('_MOB', '');
                const iframeId = "game-frame-" + index;

                // Haal opgeslagen likes op uit het lokale geheugen van de browser van de speler
                const opgeslagenLikes = localStorage.getItem('likes_' + file.name) || 0;

                lijst.innerHTML += `
                    <div class="card">
                        <h3>${schoneNaam}</h3>
                        <iframe id="${iframeId}" src="${urlData.publicUrl}" sandbox="allow-scripts allow-same-origin" allow="fullscreen"></iframe>
                        <div style="margin-top: 5px; font-size: 13px; text-align: left;">
                            ${isPC ? '🖥 PC ' : ''}
                            ${isMobiel ? '📱 Mobiel' : ''}
                        </div>
                        <div style="text-align: left; margin-top: 5px;">
                            <span class="fs-link" onclick="openFullscreen('${iframeId}')">↕ Volledig Scherm</span>
                            <button class="like-btn" onclick="likeGame('${file.name}', this)">❤️ <span class="like-count">${opgeslagenLikes}</span></button>
                        </div>
                    </div>
                `;
            });
        }

        // NIEUW: De live zoekfunctie
        window.filterGames = function() {
            const zoekTerm = document.getElementById('zoekBalk').value.toLowerCase();
            const gefilterdeGames = alleGeladenGames.filter(file => {
                const schoneNaam = file.name.replace('.html', '').replace('_PC', '').replace('_MOB', '').toLowerCase();
                return schoneNaam.includes(zoekTerm);
            });
            toonGames(gefilterdeGames);
        }

        // NIEUW: Het likes-systeem (slaat het op in de browser van de speler)
        window.likeGame = function(bestandsNaam, knop) {
            let huidigeLikes = parseInt(localStorage.getItem('likes_' + bestandsNaam)) || 0;
            huidigeLikes++;
            localStorage.setItem('likes_' + bestandsNaam, huidigeLikes);
            
            // Update het getal direct op het scherm
            knop.querySelector('.like-count').innerText = huidigeLikes;
        }

        // Volledig scherm functie
        window.openFullscreen = function(id) {
            const iframe = document.getElementById(id);
            if (iframe) {
                if (iframe.requestFullscreen) { iframe.requestFullscreen(); } 
                else if (iframe.webkitRequestFullscreen) { iframe.webkitRequestFullscreen(); } 
                else if (iframe.msRequestFullscreen) { iframe.msRequestFullscreen(); }
            }
        }

        // Uploadfunctie
        async function uploadDeGame() {
            const naamInput = document.getElementById('gameNaam').value.trim();
            const fileInput = document.getElementById('gameBestand');
            const checkPC = document.getElementById('checkPC').checked;
            const checkMobiel = document.getElementById('checkMobiel').checked;

            if (!naamInput || !fileInput.files.length) {
                alert("Vul een naam in en kies een .html game-bestand!");
                return;
            }

            const bestand = fileInput.files;
            
            let bestandsNaam = naamInput;
            if (checkPC) bestandsNaam += "_PC";
            if (checkMobiel) bestandsNaam += "_MOB";
            bestandsNaam += ".html";

            alert("Bezig met uploaden... even geduld.");

            const { data, error } = await supabase.storage
                .from('games')
                .upload(bestandsNaam, bestand, { 
                    contentType: 'text/html',
                    upsert: true 
                });

            if (error) {
                alert("Er ging Microsoft iets mis met de upload: " + error.message);
            } else {
                alert("Je game staat live op de website!");
                document.getElementById('gameNaam').value = "";
                fileInput.value = "";
                document.getElementById('checkPC').checked = false;
                document.getElementById('checkMobiel').checked = false;
                laadGames(); 
            }
        }

        laadGames();
    </script>
</body>
</html>
