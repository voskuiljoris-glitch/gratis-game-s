<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gratis Game Platform</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 20px; text-align: left; }
        .topbar h1 { margin: 0; font-size: 22px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; display: inline-block; margin: 20px; border: 2px dashed #444; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; }
        .card { background: #222; padding: 15px; border-radius: 10px; border: 1px solid #333; }
        iframe { width: 100%; height: 400px; border: none; background: #000; border-radius: 5px; }
        button { background: #00ca4e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button[disabled] { background: #555; cursor: not-allowed; }
        button.secundair { background: #333; }
        input { display: block; margin: 10px auto; padding: 8px; width: 250px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; }
        #status { min-height: 24px; color: #9ad; }
        .verborgen { display: none; }
    </style>

    <!-- FIX 1: echte link naar de Supabase-bibliotheek (was alleen https://unpkg.com) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="topbar">
        <h1>🎮 Open Game Platform</h1>
        <div>
            <button id="fsPaginaKnop" class="secundair">⛶ Volledig scherm</button>
            <button id="beheerKnop" class="secundair">🔑 Beheer</button>
            <button id="naarUploadKnop">+ Game uploaden</button>
        </div>
    </div>

    <!-- SCHERM 1: Games-overzicht (standaard zichtbaar) -->
    <div id="gamesScherm">
        <p>Speel gratis HTML-games, gemaakt door de community!</p>
        <input type="text" id="zoekBalk" placeholder="🔍 Zoek een game..." style="max-width: 300px;">
        <div class="grid" id="gameLijst"></div>
    </div>

    <!-- SCHERM 2: Uploadscherm (verborgen tot je op de knop klikt) -->
    <div id="uploadScherm" class="verborgen">
        <button id="terugKnop" class="secundair">&larr; Terug naar games</button>
        <div class="box">
            <h3>Zelf een game uploaden?</h3>
            <input type="text" id="gameNaam" placeholder="Naam van je game...">
            <input type="file" id="gameBestand" accept=".html">
            <div style="margin: 10px 0; font-size: 14px;">
                <label style="display:inline-block; margin-right: 15px;">
                    <input type="checkbox" id="geschiktPC" checked> 🖥️ Geschikt voor PC
                </label>
                <label style="display:inline-block;">
                    <input type="checkbox" id="geschiktTelefoon" checked> 📱 Geschikt voor telefoon
                </label>
            </div>
            <button id="uploadKnop">Nu Uploaden &amp; Publiceren</button>
            <p id="status"></p>
        </div>
    </div>

    <!-- SCHERM 3: Beheerscherm (wachtwoord-beveiligd, toont alle games incl. niet-goedgekeurde) -->
    <div id="beheerScherm" class="verborgen">
        <button id="beheerTerugKnop" class="secundair">&larr; Terug naar games</button>
        <h2>Beheer: goedkeuring van games</h2>
        <div class="grid" id="beheerLijst"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://zwfhrbvunmcdffsrgxhn.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Hrkm_ghr_xNpXdCYITo1Ug_F4assrx8";

        // FIX 2: de bibliotheek heet 'supabase' (niet 'supabasejs').
        // De client zelf noemen we 'db', anders overschrijf je de bibliotheek.
        const { createClient } = window.supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        const status = document.getElementById('status');

        // 1. Alle geuploade games inladen. toonNietGoedgekeurd=true toont alles (voor het beheerscherm)
        async function laadGames(toonNietGoedgekeurd = false) {
            const lijst = toonNietGoedgekeurd ? document.getElementById('beheerLijst') : document.getElementById('gameLijst');
            lijst.textContent = "Laden...";

            const { data, error } = await db.storage.from('games').list();

            if (error) {
                lijst.textContent = "Kon de games niet laden: " + error.message;
                console.error("Fout bij laden van games:", error.message);
                return;
            }

            lijst.innerHTML = "";

            data.forEach(async (file) => {
                if (file.name === ".emptyFolderPlaceholder") return;
                if (file.name.endsWith('.meta.json')) return; // dit is geen game, maar bijbehorende info

                const { data: urlData } = db.storage.from('games').getPublicUrl(file.name);
                // Supabase geeft .html-bestanden altijd terug als platte tekst
                // (bewuste beveiligingsmaatregel, niet aan te passen via instellingen).
                // Daarom halen we de tekst zelf op en zetten die in de iframe via
                // srcdoc, i.p.v. te vertrouwen op de content-type header van Supabase.
                const verseUrl = urlData.publicUrl + '?v=' + Date.now();

                const card = document.createElement('div');
                card.className = 'card';

                const titel = document.createElement('h3');
                // textContent i.p.v. innerHTML: een gekke bestandsnaam kan zo geen code injecteren
                titel.textContent = file.name.replace(/\.html$/, '');

                // Wrapper zodat de overlay precies over de iframe heen past
                const wrapper = document.createElement('div');
                wrapper.style.position = 'relative';

                const frame = document.createElement('iframe');
                // sandbox: de game mag draaien, maar niet bij jouw site of opslag komen
                // allow-fullscreen: nodig zodat volledig scherm werkt
                frame.setAttribute('sandbox', 'allow-scripts allow-fullscreen');
                frame.setAttribute('allowfullscreen', 'true');

                // Compatibiliteit ophalen (zo mogelijk); standaard beide aan als er
                // geen metadata-bestand is (bijv. oudere, al bestaande uploads)
                const naamZonderExt = file.name.replace(/\.html$/, '');
                let compat = { pc: true, telefoon: true, approved: true };
                try {
                    const { data: metaUrlData } = db.storage.from('games').getPublicUrl(naamZonderExt + '.meta.json');
                    const metaRes = await fetch(metaUrlData.publicUrl + '?v=' + Date.now());
                    if (metaRes.ok) {
                        const metaJson = await metaRes.json();
                        compat = {
                            pc: !!metaJson.pc,
                            telefoon: !!metaJson.telefoon,
                            // Bestaande metadata zonder 'approved'-veld (van vóór deze functie) blijft goedgekeurd
                            approved: metaJson.approved === undefined ? true : !!metaJson.approved
                        };
                    }
                } catch (e) {
                    // geen metadata gevonden, standaardwaarden blijven gelden
                }

                // In het gewone overzicht tonen we alleen goedgekeurde games
                if (!compat.approved && !toonNietGoedgekeurd) return;

                let iconen = '';
                if (compat.pc) iconen += '🖥️ ';
                if (compat.telefoon) iconen += '📱 ';

                // Overlay: één klik = focus op het spel + meteen volledig scherm
                const overlay = document.createElement('div');
                overlay.innerHTML = '<div style="font-size:22px; margin-bottom:8px;">' + iconen + '</div>▶ Klik om te spelen';
                overlay.style.position = 'absolute';
                overlay.style.inset = '0';
                overlay.style.display = 'flex';
                overlay.style.flexDirection = 'column';
                overlay.style.alignItems = 'center';
                overlay.style.justifyContent = 'center';
                overlay.style.background = 'rgba(0,0,0,0.6)';
                overlay.style.color = '#fff';
                overlay.style.fontSize = '16px';
                overlay.style.fontWeight = 'bold';
                overlay.style.cursor = 'pointer';
                overlay.style.borderRadius = '5px';
                overlay.addEventListener('click', () => {
                    if (frame.requestFullscreen) {
                        frame.requestFullscreen();
                    } else if (frame.webkitRequestFullscreen) {
                        frame.webkitRequestFullscreen();
                    }
                    frame.contentWindow && frame.contentWindow.focus();
                    overlay.remove();
                });

                wrapper.appendChild(frame);
                wrapper.appendChild(overlay);

                card.appendChild(titel);

                // In het beheerscherm: status tonen + goedkeuren-knop bij niet-goedgekeurde games
                if (toonNietGoedgekeurd) {
                    const statusLabel = document.createElement('p');
                    statusLabel.style.fontSize = '13px';
                    statusLabel.style.margin = '4px 0';
                    statusLabel.textContent = compat.approved ? '✅ Goedgekeurd' : '⏳ Wacht op goedkeuring';
                    statusLabel.style.color = compat.approved ? '#5f5' : '#fc5';
                    card.appendChild(statusLabel);

                    if (!compat.approved) {
                        const knopRij = document.createElement('div');
                        knopRij.style.display = 'flex';
                        knopRij.style.gap = '8px';
                        knopRij.style.justifyContent = 'center';
                        knopRij.style.marginBottom = '10px';

                        const goedkeurKnop = document.createElement('button');
                        goedkeurKnop.textContent = '✅ Goedkeuren';
                        goedkeurKnop.addEventListener('click', async () => {
                            goedkeurKnop.disabled = true;
                            goedkeurKnop.textContent = 'Bezig...';
                            const nieuweMeta = { pc: compat.pc, telefoon: compat.telefoon, approved: true };
                            await db.storage
                                .from('games')
                                .upload(naamZonderExt + '.meta.json', new Blob([JSON.stringify(nieuweMeta)], { type: 'application/json' }), {
                                    contentType: 'application/json',
                                    upsert: true
                                });
                            laadGames(true);
                        });

                        const afkeurKnop = document.createElement('button');
                        afkeurKnop.textContent = '❌ Afkeuren';
                        afkeurKnop.style.background = '#c0392b';
                        afkeurKnop.addEventListener('click', async () => {
                            if (!confirm('Weet je zeker dat je "' + naamZonderExt + '" wilt afkeuren en verwijderen?')) return;
                            afkeurKnop.disabled = true;
                            afkeurKnop.textContent = 'Bezig...';
                            await db.storage.from('games').remove([file.name, naamZonderExt + '.meta.json']);
                            laadGames(true);
                        });

                        knopRij.appendChild(goedkeurKnop);
                        knopRij.appendChild(afkeurKnop);
                        card.appendChild(knopRij);
                    }
                }

                card.appendChild(wrapper);
                lijst.appendChild(card);

                // Ruwe HTML-tekst ophalen en in de iframe laden
                fetch(verseUrl)
                    .then(res => res.text())
                    .then(html => { frame.srcdoc = html; })
                    .catch(err => {
                        frame.replaceWith(document.createTextNode('Kon deze game niet laden.'));
                        console.error('Fout bij laden van game-inhoud:', err);
                    });
            });

            if (!lijst.children.length) {
                lijst.textContent = "Nog geen games geupload.";
            }
        }

        // 2. Uploaden
        async function uploadDeGame() {
            const knop = document.getElementById('uploadKnop');
            const naam = document.getElementById('gameNaam').value.trim();
            const fileInput = document.getElementById('gameBestand');

            if (!naam || !fileInput.files.length) {
                alert("Vul een naam in en kies een .html game-bestand!");
                return;
            }

            // Spaties en rare tekens in de bestandsnaam geven problemen in de URL
            const veiligeNaam = naam.replace(/[^a-zA-Z0-9-_]/g, '-').toLowerCase();
            const bestand = fileInput.files[0];

            knop.disabled = true;
            status.textContent = "Bezig met uploaden...";

            const { error } = await db.storage
                .from('games')
                .upload(veiligeNaam + '.html', bestand, {
                    contentType: 'text/html',
                    upsert: true
                });

            // Sla ook op voor welke apparaten deze game geschikt is, en dat hij nog goedgekeurd moet worden
            if (!error) {
                const meta = {
                    pc: document.getElementById('geschiktPC').checked,
                    telefoon: document.getElementById('geschiktTelefoon').checked,
                    approved: false
                };
                await db.storage
                    .from('games')
                    .upload(veiligeNaam + '.meta.json', new Blob([JSON.stringify(meta)], { type: 'application/json' }), {
                        contentType: 'application/json',
                        upsert: true
                    });
            }

            knop.disabled = false;

            if (error) {
                status.textContent = "Er ging iets mis: " + error.message;
            } else {
                status.textContent = "Klaar! Je game is geupload en wordt binnenkort mogelijk goedgekeurd.";
                fileInput.value = "";
                document.getElementById('gameNaam').value = "";
                laadGames();
                setTimeout(() => {
                    uploadScherm.classList.add('verborgen');
                    gamesScherm.classList.remove('verborgen');
                    status.textContent = "";
                }, 2500);
            }
        }

        // Knop koppelen vanuit JS i.p.v. onclick in de HTML
        document.getElementById('uploadKnop').addEventListener('click', uploadDeGame);

        // Wisselen tussen games-overzicht en uploadscherm
        const gamesScherm = document.getElementById('gamesScherm');
        const uploadScherm = document.getElementById('uploadScherm');
        document.getElementById('naarUploadKnop').addEventListener('click', () => {
            gamesScherm.classList.add('verborgen');
            uploadScherm.classList.remove('verborgen');
        });
        document.getElementById('terugKnop').addEventListener('click', () => {
            uploadScherm.classList.add('verborgen');
            gamesScherm.classList.remove('verborgen');
        });

        // Beheerscherm: wachtwoord-beveiligd (verander dit wachtwoord zelf!)
        const BEHEER_WACHTWOORD = "Gamebeheer9301";
        const beheerScherm = document.getElementById('beheerScherm');
        document.getElementById('beheerKnop').addEventListener('click', () => {
            const invoer = prompt("Wachtwoord voor beheer:");
            if (invoer === BEHEER_WACHTWOORD) {
                gamesScherm.classList.add('verborgen');
                uploadScherm.classList.add('verborgen');
                beheerScherm.classList.remove('verborgen');
                laadGames(true);
            } else if (invoer !== null) {
                alert("Verkeerd wachtwoord.");
            }
        });
        document.getElementById('beheerTerugKnop').addEventListener('click', () => {
            beheerScherm.classList.add('verborgen');
            gamesScherm.classList.remove('verborgen');
        });

        // Zoekbalk: filtert de zichtbare game-kaarten op naam
        document.getElementById('zoekBalk').addEventListener('input', (e) => {
            const zoekterm = e.target.value.toLowerCase();
            document.querySelectorAll('#gameLijst .card').forEach(card => {
                const titel = card.querySelector('h3').textContent.toLowerCase();
                card.style.display = titel.includes(zoekterm) ? '' : 'none';
            });
        });

        // Volledig scherm voor de hele pagina
        document.getElementById('fsPaginaKnop').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        laadGames();
    </script>
</body>
</html>
